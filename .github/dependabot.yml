# From tikoci-dependencies' dependabot.example.yml.
version: 2
updates:
  # Action SHAs, bumped weekly in one grouped PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Version updates wait until a release is a week old; security updates do not.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # Packages in package.json and bun.lock. Drop this block for a repo that
  # updates by hand on a stated schedule.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ["*"]
    ignore:
      # Moves with the Bun pin in packageManager (tikoci-toolchain).
      - dependency-name: "@types/bun"
      # Stays on the engines.node major (22), so src/ is not typed with APIs
      # from later Node majors; raised together with engines.node. Within
      # 22.x the types still include APIs added after 22.0 (e.g.
      # process.getBuiltinModule, 22.3), which this does not catch.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
