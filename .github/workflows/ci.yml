# CI, from tikoci-ci's ci.example.yml (see that skill for the reasons behind
# each block). Every job runs a package script, so a red job reproduces with
# one local command.
#
#   changes ───┐
#   lint ──────┤
#   unit ──────┼─→ smoke  (a CHR, integration.yml; skipped for docs-only diffs)
#   node ──────┤     │
#   audit ─────┴─────┴─→ gate  (the one required check)
#                         └─→ report  (a scheduled run opens or updates its issue)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly: the same jobs on the latest Bun (tikoci-ci, "The Bun version").
    # For a tool that runs on its users' Bun. A repo that ships its own Bun (a
    # container image) can drop the schedule and keep the input.
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      bun-version:
        description: "Bun to run: empty for the packageManager pin, `latest`, or an exact version"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A new push to a PR replaces its run; runs on main and scheduled runs
  # finish, though a newer pending run replaces an older pending one. That is
  # fine for tests; a data or deploy group sets `queue: max` instead
  # (tikoci-ci, "Every workflow", also for when main may cancel).
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # An explicit `bash` runs with -o pipefail; the unspecified default does
    # not, and `bun test | tee` would report the exit code of tee.
    shell: bash

env:
  # Empty means the pin: setup-bun reads bun-version first, then bun-version-file.
  BUN_VERSION: ${{ github.event_name == 'schedule' && 'latest' || inputs.bun-version }}

jobs:
  # Is this diff docs-only? Only the CHR smoke skips on the answer
  # (tikoci-ci, "Docs-only classification"): any error, a list at GitHub's
  # cap, a schedule or a dispatch runs everything.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the PR's file list
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - name: Classify the diff
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          # Paths only people, agents and the always-run lint job read.
          DOCS_ONLY: '^([^/]*\.md|LICENSE)$'
        run: |
          # One line per changed file: its name and, for a rename, the old
          # name too, since either may be code. GitHub lists at most 3000
          # files for a PR and 300 for a compare; a list at the cap may be
          # partial, so it runs everything. A push compare counts only when
          # it is `ahead`: after a force push it is `diverged`, and the jq
          # error runs everything.
          records=""
          cap=0
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              cap=3000
              records=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
                --jq '.[] | [.filename, .previous_filename // empty] | join("\t")') || records="" ;;
            push)
              cap=300
              records=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" \
                --jq 'if .status == "ahead" then .files[] | [.filename, .previous_filename // empty] | join("\t")
                      else error("compare is \(.status), not ahead") end') || records="" ;;
          esac
          count=$(grep -c . <<< "$records" || true)
          names=$(tr '\t' '\n' <<< "$records")
          # A here-string, not a pipe: under pipefail an early `grep -q` exit
          # can fail the writer. Only grep's 1 ("no line outside DOCS_ONLY")
          # skips; 0 is code, and 2 (a bad pattern) runs everything too.
          rc=0
          grep -qvE "$DOCS_ONLY" <<< "$names" || rc=$?
          heavy=true
          if [ "$count" -gt 0 ] && [ "$count" -lt "$cap" ] && [ "$rc" -eq 1 ]; then
            heavy=false
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "Heavy jobs: $heavy ($GITHUB_EVENT_NAME, $count files)" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # shellcheck ships on the Ubuntu image; actionlint does not. The script
      # behind `lint:external` fails in CI when either is missing.
      - name: Install actionlint
        env:
          VERSION: "1.7.12"
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          file="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/$file"
          echo "$SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint
        run: bun run lint

  unit:
    name: Unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # A UDP receiver and byte parsers: cheap to run everywhere, and users
        # run quickchr on all three. Coverage is collected once, on Linux.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Record versions
        run: |
          echo "- $RUNNER_OS: Bun $(bun --version) (requested: ${BUN_VERSION:-the pin})" >> "$GITHUB_STEP_SUMMARY"
      # On Windows this is Git Bash, which sets HOME where PowerShell usually
      # does not: test both branches, or run the Windows leg under `shell:
      # pwsh` (tikoci-ci, "Every workflow").
      - name: Unit tests
        # Under the job's 15, so a hung test fails this step and the summary
        # and upload still run (tikoci-ci, "Timeouts nest").
        timeout-minutes: 10
        env:
          SCRIPT: ${{ runner.os == 'Linux' && 'test:coverage' || 'test' }}
        run: bun run "$SCRIPT" 2>&1 | tee "$RUNNER_TEMP/unit-output.txt"
      # The verdict and the coverage table in the summary; the full output
      # and lcov in an artifact. Coverage is read, never a gate.
      - name: Summarize
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Unit tests ($RUNNER_OS)"
            echo '```text'
            tail -n 40 "$RUNNER_TEMP/unit-output.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test output and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/unit-output.txt
            coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # Shipped code runs on Node too (DESIGN.md, "Node and npx"): build dist/
  # with Bun, then load it under each Node line engines.node allows.
  node:
    name: Node smoke (${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "lts/*"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          bun-version-file: package.json
      # The Node line floats on purpose: lts/* follows the current LTS.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Node smoke
        run: |
          bun run test:node | tee "$RUNNER_TEMP/node.txt"
          grep -q '^node-smoke: ok' "$RUNNER_TEMP/node.txt"
          echo "- $(tail -n 1 "$RUNNER_TEMP/node.txt")" >> "$GITHUB_STEP_SUMMARY"
      # The built CLI under Node with stdout on a terminal nobody reads; Bun
      # drives it (test/node/terminal.test.ts).
      - name: Node terminal
        run: bun run test:node-terminal

  # bun audit (tikoci-ci, "Dependency audit"). Never on an ordinary PR: a PR
  # or push audits only when it changes bun.lock or any package.json, and the
  # scheduled run audits everything, with the report job filing what it
  # finds. Release workflows run the same audit before they publish.
  # bun audit reads bun.lock, so there is no install step.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR's merge commit and its base (the first parent). A push
          # fetches its `before` commit.
          fetch-depth: 2
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          bun-version-file: package.json
      - name: Audit dependencies
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A PR is judged against its base, a push on its whole range. When
          # neither bun.lock nor any package.json (each workspace has its
          # own) changed, there is nothing to audit here. A new branch or a
          # base that cannot be found audits in full.
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            *) base="" ;;
          esac
          case "$base" in 0000000000000000000000000000000000000000) base="" ;; esac
          if [ -n "$base" ] && [ "$EVENT" = push ]; then
            git fetch --quiet --no-tags --depth=1 origin "$base" || base=""
          fi
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" > /dev/null &&
            git diff --quiet "$base" HEAD -- bun.lock ':(glob)**/package.json'; then
            echo "No change to bun.lock or any package.json: not audited here; the scheduled run audits everything."
            exit 0
          fi

          # The audit itself, and its ignore list, live in scripts/audit.ts
          # (audit.example.ts), which the release workflow runs too.
          bun run audit

  # The integration tier on a `stable` CHR, after lint and unit passed, so a
  # lint failure never boots a CHR (tikoci-ci, "A device smoke job").
  # integration.yml owns the QEMU setup; it only restores the image cache,
  # which the nightly sweep saves.
  smoke:
    name: Smoke
    needs: [changes, lint, unit]
    if: >-
      ${{ !cancelled() && needs.lint.result == 'success' && needs.unit.result == 'success'
      && needs.changes.outputs.heavy != 'false' }}
    uses: ./.github/workflows/integration.yml
    with:
      routeros: stable
      bun-version: ${{ github.event_name == 'schedule' && 'latest' || inputs.bun-version }}

  # One stable name to require in branch protection, whatever the matrix holds.
  # A skipped job (a docs-only skip) counts as passed; a failed or cancelled
  # one fails the gate. Add each new job to `needs`.
  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [changes, lint, unit, node, audit, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check needed jobs
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::A needed job failed or was cancelled."
            printf '%s\n' "$RESULTS"
            exit 1
          fi

  # GitHub mails a scheduled run's failure only to whoever last edited the
  # cron line, so the weekly run files its own issue: one open issue per
  # title, a comment for each further red week, and a "green again" comment
  # (not a close: a person closes it) so the open issue never reads as current
  # when it is not.
  report:
    name: Report the scheduled run
    # !cancelled() is a status function, so it replaces the implicit success()
    # and runs after a red gate too (GitHub's recommended form of always());
    # a cancelled run is neither red nor green.
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the issue
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.gate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Weekly CI is red
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$number" ]; then gh issue comment "$number" --body "Green again: $RUN_URL"; fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "Still red: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$(printf '%s\n\n%s\n' \
              "The weekly CI run (latest Bun, full dependency audit) failed: $RUN_URL" \
              "A red Audit job is an advisory when its log shows the report, and a registry or Bun problem when it says the audit did not complete. For any red job, dispatch CI on the same commit with bun-version empty to compare with the pin: if it fails the same jobs with the same errors, the cause is not Bun; a different failure settles nothing.")"
          fi
