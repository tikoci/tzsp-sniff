# The integration tier on every active RouterOS channel (tikoci-testing,
# "Tiers"): nightly, by dispatch, and called by the release workflow before
# it publishes (#17). Each resolved version boots once, through
# integration.yml, which owns the QEMU setup and saves the image cache for
# that version. Every leg must pass. Locally, one leg:
# `TZSP_SNIFF_ROUTEROS=<channel or version> bun run test:integration`.
name: Sweep

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      bun-version:
        description: "Bun to run: empty for the packageManager pin, `latest`, or an exact version"
        type: string
        default: ""
  # A release calls it with no input, so it runs on the pin.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A sweep finishes; a newer pending one replaces an older pending one.
  group: sweep-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: ${{ inputs.bun-version }}

jobs:
  plan:
    name: Plan the channels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve the active channels
        id: plan
        run: |
          bun scripts/sweep-plan.ts | tee "$RUNNER_TEMP/plan.txt"
          { echo "### Sweep plan"; echo '```text'; cat "$RUNNER_TEMP/plan.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: RouterOS ${{ matrix.leg.version }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/integration.yml
    with:
      routeros: ${{ matrix.leg.version }}
      label: ${{ matrix.leg.version }}, ${{ matrix.leg.channels }}
      bun-version: ${{ inputs.bun-version }}
      save-cache: true

  # GitHub mails a scheduled run's failure only to whoever last edited the
  # cron line, so the nightly run files its own issue, as CI's weekly run does.
  report:
    name: Report the scheduled run
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    needs: [plan, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the issue
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Nightly integration sweep is red
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ "$FAILED" != "true" ]; then
            if [ -n "$number" ]; then gh issue comment "$number" --body "Green again: $RUN_URL"; fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "Still red: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$(printf '%s\n\n%s\n' \
              "The nightly sweep of the active RouterOS channels failed: $RUN_URL" \
              "Each leg's summary names the RouterOS version and architecture the CHR reported; its artifact holds the test output and quickchr's machine logs. A red plan job means a channel did not resolve. Reproduce one leg with TZSP_SNIFF_ROUTEROS=<version> bun run test:integration.")"
          fi
