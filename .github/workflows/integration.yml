# The integration tier on a real CHR, for one RouterOS target, on a Linux
# x86 runner (tikoci-ci, "A device smoke job"; DESIGN.md, "Testing"). One
# workflow owns the QEMU setup: CI calls it for the `stable` smoke on code
# PRs, sweep.yml calls it for each active channel, and anyone can dispatch
# it on a branch. Locally: `bun run test:integration`.
name: Integration

on:
  workflow_call:
    inputs:
      routeros:
        description: "RouterOS to boot: a channel (stable, long-term, testing, development) or an exact version"
        type: string
        default: stable
      label:
        description: "What the target stands for in job names, such as the channels a version was resolved from"
        type: string
        default: ""
      bun-version:
        description: "Bun to run: empty for the packageManager pin, `latest`, or an exact version"
        type: string
        default: ""
      save-cache:
        description: "Save the CHR image cache for this version (the sweep owns the key; the PR smoke only restores)"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      routeros:
        description: "RouterOS to boot: a channel (stable, long-term, testing, development) or an exact version"
        type: string
        default: stable
      bun-version:
        description: "Bun to run: empty for the packageManager pin, `latest`, or an exact version"
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Empty means the pin: setup-bun reads bun-version first, then bun-version-file.
  BUN_VERSION: ${{ inputs.bun-version }}

jobs:
  integration:
    name: Integration (${{ inputs.label || inputs.routeros }})
    runs-on: ubuntu-latest
    # About 3 minutes measured end to end under KVM: setup, a 25 s boot and
    # 10 s of tests. The test step's cap is 10 minutes under this, so a hang
    # still reaches the summary and the upload (tikoci-ci, "Timeouts nest").
    timeout-minutes: 25
    env:
      QUICKCHR_NO_TIPS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install QEMU
        run: |
          echo "::group::apt-get install"
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils
          echo "::endgroup::"
          command -v qemu-system-x86_64 > /dev/null || { echo "::error::QEMU did not install (infrastructure)"; exit 1; }
      # The answer reaches quickchr through QUICKCHR_ACCEL, which the tests
      # pass on to it: quickchr alone would see a writable /dev/kvm and pick
      # KVM whether or not it works.
      - name: Enable and probe KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          # /dev/kvm existing is not KVM working: open it for real.
          pid="$RUNNER_TEMP/kvm-probe.pid"
          if qemu-system-x86_64 -machine none -accel kvm -display none -nodefaults \
              -daemonize -pidfile "$pid" > "$RUNNER_TEMP/kvm-probe.log" 2>&1; then
            kill "$(cat "$pid")" 2> /dev/null || true
            accel=kvm
          else
            accel=tcg
            echo "::warning::KVM did not initialize; the CHR boots under TCG and is much slower."
            cat "$RUNNER_TEMP/kvm-probe.log"
          fi
          echo "QUICKCHR_ACCEL=$accel" >> "$GITHUB_ENV"
          echo "- Accelerator: $accel" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Named here, so the cache step and quickchr cannot disagree. quickchr
      # keeps its machines and, under cache/, its images in this root.
      - name: Set the data root
        run: echo "QUICKCHR_DATA_DIR=$RUNNER_TEMP/quickchr" >> "$GITHUB_ENV"
      # Resolve once: the cache key, the prefetch and the boot use this version.
      - name: Resolve the RouterOS version
        id: resolve
        env:
          ROUTEROS: ${{ inputs.routeros }}
        run: |
          case "$ROUTEROS" in
            stable | long-term | testing | development) flag=--channel ;;
            *) flag=--version ;;
          esac
          out=$(node_modules/.bin/quickchr cache key "$flag" "$ROUTEROS" --arch x86)
          version=$(sed -n 's/^version=//p' <<< "$out")
          dir=$(sed -n 's/^dir=//p' <<< "$out")
          if ! grep -qE '^[0-9]+\.[0-9]+' <<< "$version" || [ -z "$dir" ]; then
            echo "::error::RouterOS target \"$ROUTEROS\" did not resolve to a version (quickchr cache key said: $out)"
            exit 1
          fi
          { echo "version=$version"; echo "dir=$dir"; } >> "$GITHUB_OUTPUT"
      - name: Restore the CHR image cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.resolve.outputs.dir }}
          key: chr-images-v1-${{ runner.os }}-x86-${{ steps.resolve.outputs.version }}
      # The download happens here, never inside a test's timeout.
      - name: Prefetch the CHR image
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: node_modules/.bin/quickchr cache add --version "$VERSION" --arch x86
      - name: Save the CHR image cache
        if: ${{ inputs.save-cache && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.resolve.outputs.dir }}
          key: chr-images-v1-${{ runner.os }}-x86-${{ steps.resolve.outputs.version }}
      - name: Record versions
        env:
          ROUTEROS: ${{ inputs.routeros }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          {
            echo "- RouterOS target: $ROUTEROS, resolved to $VERSION"
            echo "- Bun $(bun --version) (requested: ${BUN_VERSION:-the pin}), $(node_modules/.bin/quickchr --version | head -n 1)"
            echo "- $(qemu-system-x86_64 --version | head -n 1)"
          } >> "$GITHUB_STEP_SUMMARY"
      # The tests boot, check and remove their own CHR (test/integration/).
      - name: Integration tests
        timeout-minutes: 15
        env:
          TZSP_SNIFF_ROUTEROS: ${{ steps.resolve.outputs.version }}
          TZSP_SNIFF_INTEGRATION_RESULTS: ${{ runner.temp }}/integration-results.json
        run: bun run test:integration 2>&1 | tee "$RUNNER_TEMP/integration-output.txt"
      # The version and architecture the CHR reported come from the results
      # file the tests write, not from the channel asked for.
      - name: Summarize
        if: ${{ !cancelled() }}
        env:
          RESULTS: ${{ runner.temp }}/integration-results.json
        run: |
          {
            echo "### Integration"
            if [ -s "$RESULTS" ]; then
              jq -r '"- The CHR reported RouterOS \(.router.version // "unknown") \(.router.architecture // "unknown") (\(.target)); \(.quickchr), accelerator \(.accelerator // "unknown"), boot \(.bootMs // "?") ms; passed: \([.passed[].test] | join(", "))"' "$RESULTS"
            else
              echo "- No results file: the tests stopped before writing one."
            fi
            echo '```text'
            tail -n 40 "$RUNNER_TEMP/integration-output.txt" 2> /dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The results and output, the QEMU log the tests copy out before they
      # remove the machine, and quickchr's data root (boot-failure files);
      # never the image cache. include-hidden-files keeps any
      # dot path quickchr writes, or the upload is silently thinner.
      - name: Upload results and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The target when it did not resolve: sweep legs each pass their own.
          name: integration-${{ steps.resolve.outputs.version || inputs.routeros }}
          path: |
            ${{ runner.temp }}/integration-results.json
            ${{ runner.temp }}/integration-output.txt
            ${{ runner.temp }}/tzsp-it-*.log
            ${{ runner.temp }}/kvm-probe.log
            ${{ env.QUICKCHR_DATA_DIR }}
            !${{ env.QUICKCHR_DATA_DIR }}/cache
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
